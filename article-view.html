<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI_Hues — Article</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <style>
    .article-body p { margin: 0 0 14px; color: var(--muted); }
    .article-body a { word-break: break-all; }
    .article-body strong { color: var(--text); }
  </style>
</head>
<body>
  <header class="site-header"><div id="nav-mount"></div></header>
  <main class="wrap section">
    <p class="muted"><a href="./articles.html">← Articles</a></p>
    <h1 id="art-title"></h1>
    <p class="muted" id="art-meta"></p>
    <article class="card" style="margin-top:16px">
      <div class="article-body" id="art-body"></div>
    </article>
    <h2 style="margin-top:28px">Article comments (A2)</h2>
    <div class="comment"><strong>@reader</strong> — Demo thread on AI_Hues (placeholder).</div>
    <textarea rows="2" placeholder="Sign in to post (prototype)"></textarea>
    <div class="row"><button type="button" class="btn btn-ghost" disabled>Post</button></div>
  </main>
  <footer class="site-footer"><div class="wrap"><span data-i18n="footerNote"></span></div></footer>
  <script src="./assets/articles-data.js"></script>
  <script src="./assets/app.js"></script>
  <script>
    function ghMdToHtml(s) {
      return s
        .split(/\n\n+/)
        .map(function (p) {
          p = p.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
          p = p.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
          return "<p>" + p + "</p>";
        })
        .join("");
    }
    function getLang() {
      try {
        var s = localStorage.getItem("ai_hues_lang");
        if (s === "zh" || s === "en") return s;
      } catch (e) {}
      return "en";
    }
    var id = parseInt(new URLSearchParams(location.search).get("id") || "0", 10);
    var list = window.AI_HUES_ARTICLES || [];
    var a = list.find(function (x) { return x.id === id; }) || list[0];
    var lang = getLang();
    document.getElementById("art-title").textContent = lang === "zh" ? a.title_zh : a.title_en;
    document.getElementById("art-meta").textContent =
      (lang === "zh" ? "GitHub 元数据快照 · " : "GitHub metadata snapshot · ") +
      a.full_name +
      " · ★ " +
      (a.stars || 0).toLocaleString();
    var hues = lang === "zh" ? a.hues_html_zh : a.hues_html_en;
    document.getElementById("art-body").innerHTML =
      (hues || "") + ghMdToHtml(lang === "zh" ? a.body_zh : a.body_en);
    document.title = (lang === "zh" ? a.title_zh : a.title_en) + " — AI_Hues";
  </script>
</body>
</html>
